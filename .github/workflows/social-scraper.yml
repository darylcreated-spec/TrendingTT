name: Scheduled Social & Broadcast Scraper

on:
  schedule:
    # Runs every 30 minutes, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: ingestion-worker
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install yt-dlp & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --break-system-packages yt-dlp requests beautifulsoup4 || pip3 install yt-dlp requests beautifulsoup4

      - name: Install Dependencies
        run: npm ci

      - name: Run Social Ingestion Worker
        run: node scripts/ingestion-worker.mjs
        env:
          RSS_BRIDGE_URL: ${{ secrets.RSS_BRIDGE_URL || 'https://rss-bridge.org/bridge01' }}

      - name: Run Python Local News Scraper (Decoupled Mode)
        run: python3 scripts/news_scraper.py --output public/data/ingested-posts.json --decoupled

      - name: Run Python Utilities Scraper
        run: python3 scripts/utilities_scraper.py --output public/data/utilities.json

      - name: Commit & Push Updated Data to Decoupled Data Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: data-feed
          create_branch: true
          commit_message: "chore(data): auto-update ingested social feeds [skip ci]"
          file_pattern: "public/data/ingested-posts.json public/data/utilities.json"
          commit_user_name: "Trending TT Bot"
          commit_user_email: "bot@trendingtt.com"
