<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Soft outer drop shadow for the frosted circular lens -->
    <filter id="lensShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <!-- Drop shadow for the floating national flag squircle -->
    <filter id="flagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.98" />
    </linearGradient>
    <clipPath id="flagSquircle">
      <rect x="106" y="46" width="300" height="300" rx="54" />
    </clipPath>
  </defs>

  <!-- 1. Deep Black/Slate Base Canvas (#020617 matches PWA splash screen) -->
  <rect width="512" height="512" fill="#020617" />

  <!-- 2. National Flag Squircle (Upper Center) with Shadow -->
  <g filter="url(#flagShadow)">
    <g clip-path="url(#flagSquircle)">
      <!-- Scarlet Red field -->
      <rect x="106" y="46" width="300" height="300" fill="#CE1126" />
      <!-- Diagonal White Stripe -->
      <polygon points="106,46 190,46 406,262 406,346 322,346 106,130" fill="#FFFFFF" />
      <!-- Central Black Stripe -->
      <polygon points="106,46 166,46 406,286 406,346 346,346 106,106" fill="#0A0A0C" />
    </g>
    <!-- Squircle Subtle Rim Outline -->
    <rect x="106" y="46" width="300" height="300" rx="54" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.4" />
  </g>

  <!-- 3. Floating Circular Frosted Glass Lens with Ascending Arrow -->
  <g filter="url(#lensShadow)">
    <circle cx="256" cy="196" r="92" fill="url(#glassGrad)" />
    <!-- Polished Chrome / White outer rim -->
    <circle cx="256" cy="196" r="92" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-opacity="0.95" />
    <!-- Crimson inner accent ring -->
    <circle cx="256" cy="196" r="86" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-opacity="0.6" />
    
    <!-- Bold Clean Ascending White Trending Arrow -->
    <path d="M 196 234 L 236 192 L 270 214 L 316 150" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="276,150 316,150 316,190" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ruby Beacon Apex Dot with Radiant Glow -->
    <circle cx="316" cy="150" r="8" fill="#EF4444" />
    <circle cx="316" cy="150" r="3" fill="#FFFFFF" />
    <circle cx="316" cy="150" r="14" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  </g>

  <!-- 4. Words In The Black Part Under The National Flag -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TRENDING<tspan fill="#EF4444">.TT</tspan></text>
</svg>