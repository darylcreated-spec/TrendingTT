<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flareRed" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#FF3333" />
    </linearGradient>
    <linearGradient id="flagWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#EF4444" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="#DC2626" stroke-width="6" stroke-opacity="0.4" />

  <!-- Trinidad & Tobago Flag Diagonal Stripe Motif -->
  <polygon points="0,460 70,512 512,70 442,0" fill="url(#flagWhite)" />
  <polygon points="0,488 36,512 512,36 476,0" fill="#0A0A0C" opacity="0.6" />
  <polygon points="0,504 16,512 512,16 496,0" fill="#DC2626" opacity="0.4" />

  <!-- Rising Trending Flare Vector -->
  <!-- Base zigzag trendline -->
  <path d="M 96 360 L 196 260 L 284 320 L 416 150" fill="none" stroke="url(#flareRed)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Arrow Head -->
  <polyline points="320,150 416,150 416,246" fill="none" stroke="url(#flareRed)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Trend Peak Live Beacon -->
  <circle cx="416" cy="150" r="18" fill="#FFFFFF" />
  <circle cx="416" cy="150" r="30" fill="none" stroke="#FF4444" stroke-width="4" opacity="0.6" />

  <!-- Trending.TT Brand Signature -->
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TRENDING<tspan fill="#EF4444">.TT</tspan></text>
</svg>