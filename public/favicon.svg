<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#CE1126" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#CE1126" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Diagonal Trinidad Band -->
  <polygon points="0,512 120,512 512,120 512,0" fill="#FFFFFF" opacity="0.9" />
  <polygon points="0,512 90,512 512,90 512,0" fill="#0A0A0B" />
  <polygon points="0,512 60,512 512,60 512,0" fill="#CE1126" opacity="0.3" />

  <!-- Trending Pulse Icon -->
  <circle cx="160" cy="180" r="18" fill="#CE1126" />
  <circle cx="160" cy="180" r="32" fill="none" stroke="#CE1126" stroke-width="4" opacity="0.5" />
  <path d="M 160 180 L 260 280 L 330 210 L 410 300" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="370,300 410,300 410,260" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- TT Text Badge -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TRENDING.TT</text>
</svg>